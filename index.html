  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    #map {
      height: 100dvh;
      width: 100vw;
      z-index: 10;
      background: #f8fafc;
    }
    
    .leaflet-routing-container {
      display: none !important;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 1rem !important;
      padding: 4px !important;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15) !important;
    }
    .leaflet-popup-content {
      margin: 8px 10px !important;
      line-height: 1.4 !important;
      max-width: 82vw !important;
    }

    .pin-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      box-shadow: 0 4px 6px rgba(0,0,0,0.25);
      border: 2px solid #ffffff;
    }
    .pin-marker i {
      transform: rotate(45deg);
      color: white;
      font-size: 13px;
    }

    .user-pulse-marker {
      position: relative;
      width: 16px;
      height: 16px;
      background: #2563eb;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(37,99,235,0.8);
    }
    .user-pulse-marker::after {
      content: '';
      position: absolute;
      top: -9px;
      left: -9px;
      width: 28px;
      height: 28px;
      background-color: rgba(37, 99, 235, 0.4);
      border-radius: 50%;
      animation: pulse-ring 2s infinite ease-out;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }

    function showToast(msg, icon = 'fa-circle-info', color = 'text-blue-400') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      const toastIcon = document.getElementById('toast-icon');
      toastMsg.innerText = msg;
      toastIcon.className = `fa-solid ${icon} ${color}`;
      toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-2');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-2');
      }, 3000);

      { name: "國際處 國際交流組", building: "驚聲紀念大樓", room: "T1001", targetId: "Q" },
      { name: "人力資源處 (人事處)", building: "驚聲紀念大樓", room: "T301", targetId: "Q" },
      { name: "財務處", building: "驚聲紀念大樓", room: "T301", targetId: "Q" },
      { name: "資訊處 (資訊服務組/網路營運組)", building: "工學大樓", room: "E201", targetId: "E" },
      { name: "資訊處 專案開發組", building: "工學大樓", room: "E202", targetId: "E" },
      { name: "體育處", building: "紹謨紀念體育館", room: "SG202", targetId: "SG" },
      { name: "覺生紀念圖書館 (館長室/採編組/系統組)", building: "覺生紀念圖書館", room: "U401", targetId: "U" },
      { name: "軍訓室", building: "商館", room: "B402", targetId: "B" },
      { name: "稽核室", building: "驚聲紀念大樓", room: "T1001", targetId: "Q" },
      { name: "校友服務暨資源發展處", building: "驚聲紀念大樓", room: "T1001", targetId: "Q" },
      { name: "永續發展與雲端創新中心", building: "驚聲紀念大樓", room: "T1001", targetId: "Q" },
      { name: "通識教育中心", building: "驚聲紀念大樓", room: "I302", targetId: "Q" },
      { name: "學習深化組 / 教學發展中心", building: "商館", room: "I201", targetId: "B" },
      { name: "推廣教育處 (淡水業務辦公室)", building: "驚聲紀念大樓", room: "T301", targetId: "Q" }
    ];

    // 3. 地圖初始化
    const isMobile = window.innerWidth < 640;
    const centerCoordinate = [25.1752, 121.4503];
    const map = L.map('map', { 
      zoomControl: false,
      maxBounds: [
        [25.1680, 121.4390],
        [25.1820, 121.4620]
      ],
      maxBoundsViscosity: 0.8
    }).setView(centerCoordinate, isMobile ? 16 : 17);

    // ★ 關鍵更換：使用台灣內政部國土測繪中心 (NLSC) 官方「EMAP8 純圖無文字版」
    // 免費、免 API Key、絕對無浮水印、絕對無英文 POI 標籤
    const emap8 = L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP8/default/GoogleMapsCompatible/{z}/{y}/{x}', {
      maxZoom: 20,
      attribution: '&copy; <a href="https://maps.nlsc.gov.tw/" target="_blank">國土測繪圖資服務雲</a>'
    }).addTo(map);

    // 備用底圖：標準 OpenStreetMap（含文字）
    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    });

    // 右上角圖層控制與縮放
    L.control.layers({
      "國土測繪無字版 (推薦)": emap8,
      "OpenStreetMap 標準版": osm
    }, null, { position: 'topright' }).addTo(map);

    L.control.zoom({ position: 'topright' }).addTo(map);

    // 4. 圖釘與標記
    const markersLayer = L.layerGroup().addTo(map);
    const markersById = {};

    function createCustomMarkerIcon(place) {
      return L.divIcon({
        className: '',
        html: `
          <div class="pin-marker" style="background-color: ${place.color}; width: 28px; height: 28px;">
            <i class="fa-solid ${place.icon}"></i>
          </div>
        `,
        iconSize: [28, 28],
        iconAnchor: [14, 28],
        popupAnchor: [0, -26]
      });
    }

    function getPopupHtml(place, highlightedOffice = null) {
      const officesInPlace = campusOffices.filter(o => o.targetId === place.id);
      
      let highlightHtml = '';
      if (highlightedOffice) {
        highlightHtml = `
          <div class="mb-2 p-2 bg-amber-50 border border-amber-200 rounded-xl text-xs">
            <div class="font-bold text-amber-900 flex items-center gap-1">
              <i class="fa-solid fa-crosshairs text-amber-600"></i>
              查詢目標：${highlightedOffice.name}
            </div>
            <div class="text-slate-700 mt-0.5">位置：<span class="font-bold text-red-600 font-mono">${highlightedOffice.room}</span></div>
          </div>
        `;
      }

      let officesListHtml = '';
      if (officesInPlace.length > 0) {
        officesListHtml = `
          <div class="mt-2 pt-1.5 border-t border-slate-100">
            <details class="group">
              <summary class="text-xs font-bold text-slate-500 cursor-pointer flex items-center justify-between py-1 select-none">
                <span>🏢 進駐處室 (${officesInPlace.length})</span>
                <i class="fa-solid fa-chevron-down text-[10px] transition-transform group-open:rotate-180"></i>
              </summary>
              <div class="mt-1 space-y-1 max-h-32 overflow-y-auto custom-scroll pr-1">
                ${officesInPlace.map(o => `
                  <div class="flex justify-between items-center text-xs py-0.5 px-1 rounded hover:bg-slate-50">
                    <span class="text-slate-700 truncate pr-1">${o.name}</span>
                    <span class="font-mono text-[11px] font-bold text-red-600 bg-red-50 px-1 py-0.2 rounded shrink-0">${o.room}</span>
                  </div>
                `).join('')}
              </div>
            </details>
          </div>
        `;
      }

      return `
        <div class="min-w-[190px] max-w-[260px]">
          ${highlightHtml}
          <div class="flex items-center gap-1.5 mb-1">
            <span class="text-[11px] px-1.5 py-0.2 rounded font-bold text-white shadow-sm shrink-0" style="background-color:${place.color};">
              ${place.id}
            </span>
            <h3 class="font-bold text-slate-900 text-sm truncate">${place.name}</h3>
          </div>
          <p class="text-[11px] sm:text-xs text-slate-600 mb-1.5 leading-relaxed">${place.desc}</p>
          ${officesListHtml}
          <button onclick="startNavigation(${place.lat}, ${place.lng}, '${place.name}')" 
                  class="w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white text-xs py-1.5 px-2 rounded-xl font-bold transition flex items-center justify-center gap-1 shadow-sm active:scale-95">
            <i class="fa-solid fa-person-walking text-xs"></i> 步行前往此處
          </button>
        </div>
      `;
    }

    function initMarkers() {
      campusPlaces.forEach(place => {
        const marker = L.marker([place.lat, place.lng], {
          icon: createCustomMarkerIcon(place)
        });
        marker.bindPopup(getPopupHtml(place), {
          autoPanPadding: [20, 80]
        });
        markersLayer.addLayer(marker);
        markersById[place.id] = marker;
      });
    }
    initMarkers();

    // 5. 智慧搜尋
    const searchInput = document.getElementById('search-input');
    const resultsContainer = document.getElementById('results-container');
    const clearBtn = document.getElementById('clear-search');

    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.trim().toLowerCase();
      if (!query) {
        resultsContainer.classList.add('hidden');
        clearBtn.classList.add('hidden');
        return;
      }

      clearBtn.classList.remove('hidden');
      resultsContainer.classList.remove('hidden');
      resultsContainer.innerHTML = '';

      const matchedOffices = campusOffices.filter(o => 
        o.name.toLowerCase().includes(query) || 
        o.room.toLowerCase().includes(query)
      );

      const matchedPlaces = campusPlaces.filter(p => 
        p.name.toLowerCase().includes(query) || 
        p.id.toLowerCase().includes(query) ||
        p.desc.toLowerCase().includes(query)
      );

      if (matchedOffices.length === 0 && matchedPlaces.length === 0) {
        resultsContainer.innerHTML = `<div class="p-3 text-center text-xs text-slate-400">找不到相符的處室或大樓</div>`;
        return;
      }

      if (matchedOffices.length > 0) {
        const title = document.createElement('div');
        title.className = "text-[11px] font-bold text-slate-400 px-2 pt-1";
        title.innerText = "行政處室 / 組別";
        resultsContainer.appendChild(title);

        matchedOffices.forEach(office => {
          const item = document.createElement('div');
          item.className = "p-2 hover:bg-blue-50 rounded-xl cursor-pointer flex flex-col transition border border-transparent hover:border-blue-100";
          item.innerHTML = `
            <div class="flex items-center justify-between">
              <span class="font-bold text-slate-800 text-xs">${office.name}</span>
              <span class="text-xs font-bold text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded font-mono">${office.room}</span>
            </div>
            <div class="text-[11px] text-slate-500 mt-0.5 flex items-center gap-1">
              <i class="fa-solid fa-location-dot text-slate-400 text-[10px]"></i>
              位於：<span class="text-slate-700 font-medium">${office.building}</span>
            </div>
          `;
          item.onclick = () => {
            const place = campusPlaces.find(p => p.id === office.targetId);
            if (place) {
              const marker = markersById[place.id];
              map.flyTo([place.lat, place.lng], 18, { duration: 1 });
              marker.setPopupContent(getPopupHtml(place, office));
              setTimeout(() => marker.openPopup(), 600);
              resultsContainer.classList.add('hidden');
            }
          };
          resultsContainer.appendChild(item);
        });
      }

      if (matchedPlaces.length > 0) {
        const title = document.createElement('div');
        title.className = "text-[11px] font-bold text-slate-400 px-2 pt-2";
        title.innerText = "校園建築與地標";
        resultsContainer.appendChild(title);

        matchedPlaces.forEach(place => {
          const item = document.createElement('div');
          item.className = "p-2 hover:bg-slate-100 rounded-xl cursor-pointer flex items-center justify-between transition";
          item.innerHTML = `
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full" style="background-color:${place.color};"></span>
              <span class="font-bold text-slate-800 text-xs">${place.name}</span>
            </div>
            <span class="text-[10px] text-slate-400 font-mono">${place.id}</span>
          `;
          item.onclick = () => {
            const marker = markersById[place.id];
            map.flyTo([place.lat, place.lng], 18, { duration: 1 });
            marker.setPopupContent(getPopupHtml(place));
            setTimeout(() => marker.openPopup(), 600);
            resultsContainer.classList.add('hidden');
          };
          resultsContainer.appendChild(item);
        });
      }
    });

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      resultsContainer.classList.add('hidden');
      clearBtn.classList.add('hidden');
    });

    // 6. 分類按鈕切換
    function filterCategory(cat) {
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('bg-red-600', 'text-white', 'shadow-sm');
        btn.classList.add('bg-slate-100', 'text-slate-600');
      });
      event.target.classList.remove('bg-slate-100', 'text-slate-600');
      event.target.classList.add('bg-red-600', 'text-white', 'shadow-sm');

      markersLayer.clearLayers();
      campusPlaces.forEach(place => {
        if (cat === 'all' || place.cat === cat) {
          markersLayer.addLayer(markersById[place.id]);
        }
      });
    }

    // 7. GPS 定位
    let userMarker = null;
    let userLatLng = null;

    function locateUser(callback) {
      const btn = document.getElementById('locate-btn');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-base"></i>';

      if (!navigator.geolocation) {
        showToast("您的裝置或瀏覽器不支援定位功能", "fa-triangle-exclamation", "text-amber-400");
        btn.innerHTML = '<i class="fa-solid fa-location-crosshairs text-base"></i>';
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userLatLng = [pos.coords.latitude, pos.coords.longitude];
          
          if (!userMarker) {
            const userIcon = L.divIcon({
              className: 'user-pulse-marker',
              iconSize: [16, 16],
              iconAnchor: [8, 8]
            });
            userMarker = L.marker(userLatLng, { icon: userIcon }).addTo(map);
            userMarker.bindTooltip("我的位置", { permanent: true, direction: 'bottom' });
          } else {
            userMarker.setLatLng(userLatLng);
          }

          btn.innerHTML = '<i class="fa-solid fa-location-crosshairs text-base"></i>';
          showToast("已取得您的目前位置", "fa-circle-check", "text-emerald-400");
          
          if (callback) {
            callback();
          } else {
            map.flyTo(userLatLng, 18, { duration: 1.2 });
          }
        },
        (err) => {
          showToast("無法取得定位，請確認已授權位置權限", "fa-triangle-exclamation", "text-red-400");
          btn.innerHTML = '<i class="fa-solid fa-location-crosshairs text-base"></i>';
        },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    }

    // 8. 站內步行導航
    let routingControl = null;

    function startNavigation(destLat, destLng, destName) {
      map.closePopup();

      if (!userLatLng) {
        showToast("正在取得起點位置...", "fa-location-arrow", "text-blue-400");
        locateUser(() => {
          runRouting(destLat, destLng, destName);
        });
        return;
      }

      runRouting(destLat, destLng, destName);
    }

    function runRouting(destLat, destLng, destName) {
      if (routingControl) {
        map.removeControl(routingControl);
      }

      const navBanner = document.getElementById('nav-banner');
      navBanner.classList.remove('hidden');
      navBanner.classList.add('flex');
      document.getElementById('nav-target-name').innerText = `目的地：${destName}`;
      document.getElementById('nav-distance').innerText = "規劃中...";
      document.getElementById('nav-time').innerText = "";
      
      const gmapsBtn = document.getElementById('nav-gmaps-btn');
      gmapsBtn.onclick = () => {
        window.open(`https://www.google.com/maps/dir/?api=1&origin=${userLatLng[0]},${userLatLng[1]}&destination=${destLat},${destLng}&travelmode=walking`, '_blank');
      };

      routingControl = L.Routing.control({
        waypoints: [
          L.latLng(userLatLng[0], userLatLng[1]),
          L.latLng(destLat, destLng)
        ],
        router: L.Routing.osrmv1({
          serviceUrl: 'https://routing.openstreetmap.de/routed-foot/route/v1',
          profile: 'foot'
        }),
        lineOptions: {
          styles: [
            { color: '#2563eb', opacity: 0.9, weight: 6 }
          ]
        },
        addWaypoints: false,
        draggableWaypoints: false,
        fitSelectedRoutes: true,
        show: false,
        createMarker: function() { return null; }
      }).addTo(map);

      routingControl.on('routesfound', function(e) {
        const routes = e.routes;
        const summary = routes[0].summary;
        const meters = Math.round(summary.totalDistance);
        const minutes = Math.max(1, Math.round(summary.totalTime / 60));

        document.getElementById('nav-distance').innerText = `${meters} 公尺`;
        document.getElementById('nav-time').innerText = `(步行約 ${minutes} 分鐘)`;
        
        if (routes[0].instructions && routes[0].instructions.length > 0) {
          const firstStep = routes[0].instructions[0].text;
          document.getElementById('nav-step').innerText = firstStep || "沿著步道前進";
        }
      });

      routingControl.on('routingerror', function() {
        const directDist = Math.round(map.distance(userLatLng, [destLat, destLng]));
        const directMin = Math.max(1, Math.round(directDist / 70));
        document.getElementById('nav-distance').innerText = `約 ${directDist} 公尺 (直線)`;
        document.getElementById('nav-time').innerText = `(步程約 ${directMin} 分鐘)`;
        document.getElementById('nav-step').innerText = "請參考 Google Maps 路線";
      });
    }

    function cancelNavigation() {
      if (routingControl) {
        map.removeControl(routingControl);
        routingControl = null;
      }
      const navBanner = document.getElementById('nav-banner');
      navBanner.classList.add('hidden');
      navBanner.classList.remove('flex');
    }
  </script>
</body>
</html>
